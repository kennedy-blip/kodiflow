name: Android debug build
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Verify Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo '::error::Android SDK or sdkmanager is missing on the runner'
            exit 1
          fi
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tee /tmp/sdk.log || { tail -30 /tmp/sdk.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }

      - run: npm ci
      - run: npm test
      - name: Build APK
        run: |
          set -o pipefail
          npm run cap:apk 2>&1 | tee /tmp/apk-build.log || { tail -50 /tmp/apk-build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
