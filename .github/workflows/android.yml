name: Android debug build
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Verify Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo '::error::Android SDK or sdkmanager is missing on the runner'
            exit 1
          fi
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tee /tmp/sdk.log || { tail -30 /tmp/sdk.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }

      - run: npm ci
      - run: npm test
      - name: Build APK
        run: |
          set -o pipefail
          npm run cap:apk 2>&1 | tee /tmp/apk-build.log || { tail -50 /tmp/apk-build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify and publish debug APK to this branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f26ed7b8-kodiflow'
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'classes.dex'
          jarsigner -verify "$apk" >/dev/null
          cp "$apk" public/kodiflow.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/kodiflow.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Android debug APK'
            git push origin HEAD:"refs/heads/$GITHUB_REF_NAME"
          fi
